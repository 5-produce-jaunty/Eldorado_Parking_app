<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#8c3730" />
<title>Eldorado Parking &amp; Violations</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    /* Palette from Eldorado's approved Kelly-Moore matrix
       (Saltillo terracotta, Spanish Sand, Navajo White, Oxford Brown,
        Carbon, Wood Moss, Seattle Red, Graystone). Hex values are close
        approximations of the named swatches. */
    --bg: #ece3d1;          /* light warm sand — page background */
    --bg-elev: #ffffff;     /* white cards (with subtle shadow) */
    --bg-elev-2: #f1e8d6;   /* light tan — chips/inputs */
    --line: #ded0b4;        /* Sand Pebble — borders */
    --text: #2e2620;        /* charcoal-brown — body text */
    --text-dim: #5a4c3e;    /* Oxford Brown — secondary text */
    --text-faint: #6d6358;  /* deepened Graystone — faint text */
    --accent: #b5623c;      /* Saltillo — terracotta accent (buttons/links) */
    --accent-press: #9a5030;
    --green: #6f7a43;       /* Wood Moss — olive (good) */
    --green-bg: #e7eed2;
    --red: #9c3a2e;         /* Seattle Red — brick (danger) */
    --red-bg: #f3dcd5;
    --amber: #b98a3a;       /* gold (pending) */
    --amber-bg: #f5e8c8;
    /* graduated strike severity: 1 = bright yellow, 2 = vivid orange, 3 = red (wide gap) */
    --yellow: #f7d11a;
    --yellow-bg: #fdf0b8;
    --orange: #e8711a;
    --orange-bg: #fbdcc0;
    --radius: 14px;
    --tap: 52px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 86px; /* room for bottom nav */
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar (role switcher) ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(135deg, #a8463b, #89342c);
    border-bottom: 1px solid rgba(0,0,0,.18);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  header .brand { font-weight: 700; font-size: 15px; letter-spacing: .2px; color: #fff8ef; }
  header .brand small { display: block; color: rgba(255,248,239,.78); font-weight: 500; font-size: 11px; }
  header .role { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  header select {
    background: rgba(255,250,242,.94); color: var(--text);
    border: 1px solid rgba(255,255,255,.45); border-radius: 10px;
    padding: 9px 10px; font-size: 14px; min-height: 40px;
  }

  /* ---------- Layout ---------- */
  main { max-width: 720px; margin: 0 auto; padding: 14px; }
  .screen { display: none; }
  .screen.active { display: block; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  h1 { font-size: 20px; margin: 4px 0 14px; }
  h2 { font-size: 15px; margin: 22px 0 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px; }
  p.hint { color: var(--text-dim); font-size: 13px; margin: 6px 0 0; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(70,50,30,.06), 0 2px 6px rgba(70,50,30,.05);
  }
  .card.tight { padding: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.wrap { flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .muted { color: var(--text-dim); }
  .faint { color: var(--text-faint); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* ---------- Plate display ---------- */
  .plate {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-weight: 700; letter-spacing: 2px;
    background: #fbf9f4; color: #2a2118;
    border-radius: 8px; padding: 4px 10px; display: inline-block;
    border: 2px solid #d8c7ac;
  }
  .plate.lg { font-size: 26px; padding: 8px 16px; letter-spacing: 3px; }

  /* ---------- Buttons ---------- */
  button, .btn {
    font: inherit; font-weight: 600;
    border: 1px solid var(--line);
    background: var(--bg-elev-2); color: var(--text);
    border-radius: 12px; padding: 0 16px; min-height: var(--tap);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .04s ease, background .12s ease;
  }
  button:active, .btn:active { transform: scale(.985); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:active { background: var(--accent-press); }
  .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-ghost { background: transparent; }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
  button:disabled { opacity: .5; }

  /* ---------- Inputs ---------- */
  label.field { display: block; margin: 12px 0; }
  label.field > span { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; font: inherit;
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; min-height: var(--tap);
  }
  textarea { min-height: 84px; resize: vertical; }
  input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 > * { min-width: 0; } /* let grid cells shrink so inputs don't overflow/overlap */

  /* ---------- Badges / pills ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line);
  }
  /* Strike/status pills are SOLID so the severity hues read distinctly:
     green = ok, gold = strike 1, orange = strike 2, red = strike 3/denied. */
  .pill.green { background: #5f7a33; color: #fff; border-color: #51692a; }
  .pill.red { background: #c0392b; color: #fff; border-color: #a52d21; }
  .pill.orange { background: #e8711a; color: #2e1700; border-color: #cf6214; }
  .pill.yellow { background: #f7d11a; color: #3a2c00; border-color: #e0bb10; }
  .pill.amber { background: var(--amber-bg); color: #6e5114; border-color: #ddc585; } /* pending (soft) */
  .pill.gray { background: var(--bg-elev-2); color: var(--text-dim); border-color: var(--line); }
  .pill .dot { display: none; } /* solid pills don't need the inner dot */

  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.green { background: var(--green); } .dot.red { background: var(--red); } .dot.amber { background: var(--amber); } .dot.gray { background: var(--text-faint); }
  .dot.yellow { background: var(--yellow); } .dot.orange { background: var(--orange); }

  /* ---------- Big status card (patrol) ---------- */
  .status {
    border-radius: var(--radius); padding: 16px; margin-top: 14px;
    border: 2px solid var(--line);
  }
  .status.ok { background: linear-gradient(160deg, #e9efd6, #e1eac8); border-color: #b6c489; }
  .status.bad { background: linear-gradient(160deg, #f3ddd4, #eed1c6); border-color: #d9a99c; }
  .status .big { font-size: 22px; font-weight: 800; margin: 8px 0 2px; }
  .status .sub { color: var(--text-dim); font-size: 13px; }

  .strikepips { display: inline-flex; gap: 5px; align-items: center; }
  .pip { width: 14px; height: 14px; border-radius: 4px; background: var(--bg-elev-2); border: 1px solid var(--line); }
  .pip.on { background: var(--red); border-color: var(--red); }
  .pip.s1 { background: var(--yellow); border-color: var(--yellow); }
  .pip.s2 { background: var(--orange); border-color: var(--orange); }
  .pip.s3 { background: var(--red); border-color: var(--red); }

  /* ---------- Lists ---------- */
  .listitem { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .listitem:last-child { border-bottom: none; }
  .empty { color: var(--text-faint); font-size: 14px; padding: 18px 4px; text-align: center; }
  .meta { font-size: 12px; color: var(--text-faint); }

  /* ---------- Bottom nav ---------- */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: var(--bg-elev); border-top: 1px solid var(--line);
    display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs button {
    flex: 1; flex-direction: column; gap: 3px; min-height: 60px;
    background: transparent; border: none; color: var(--text-faint);
    font-size: 11px; font-weight: 600; border-radius: 12px;
  }
  nav.tabs button .ico { font-size: 22px; line-height: 1; }
  nav.tabs button.active { color: var(--accent); }
  nav.tabs button[hidden] { display: none; }

  /* ---------- Modal ---------- */
  .modal-bg {
    position: fixed; inset: 0; z-index: 50; background: rgba(48,32,20,.5);
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: 18px 18px 0 0; width: 100%; max-width: 720px;
    max-height: 90vh; overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    animation: slideup .2s ease;
  }
  @media (min-width: 560px) { .modal-bg { align-items: center; } .modal { border-radius: 18px; } }
  @keyframes slideup { from { transform: translateY(20px); opacity: .6; } to { transform: none; opacity: 1; } }
  .modal h3 { margin: 4px 0 4px; font-size: 18px; }

  /* rule picker buttons */
  .rule-btn { width: 100%; text-align: left; justify-content: flex-start; margin-bottom: 8px; min-height: 56px; line-height: 1.3; padding: 12px 14px; }
  .rule-btn small { display: block; color: var(--text-faint); font-weight: 500; font-size: 12px; }

  .notice { font-size: 13px; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .notice.info { background: #e7eef4; border: 1px solid #cdddea; color: #345a72; }
  .notice.warn { background: var(--amber-bg); border: 1px solid #ddc585; color: #6e5114; }
  .notice.good { background: var(--green-bg); border: 1px solid #b6c489; color: #485524; }
  /* strike-severity notices — distinct tints + a bold left accent in the strike color */
  .notice.yellow { background: var(--yellow-bg); border: 1px solid #ecd24a; border-left: 5px solid #f7d11a; color: #6b5200; }
  .notice.orange { background: var(--orange-bg); border: 1px solid #ec9a4a; border-left: 5px solid #e8711a; color: #8a3f0e; }
  .notice.red { background: var(--red-bg); border: 1px solid #e08b78; border-left: 5px solid #c0392b; color: #962a1c; }

  .tablerow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .seg { display: inline-flex; background: var(--bg-elev-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
  .seg button { min-height: 38px; padding: 0 12px; border: none; background: transparent; color: var(--text-dim); font-size: 13px; border-radius: 9px; }
  .seg button.active { background: var(--accent); color: #fff; }
  a.link { color: var(--accent); text-decoration: none; }

  /* ---------- Range calendar ---------- */
  .cal { background: var(--bg-elev-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head .mname { font-weight: 700; font-size: 15px; }
  .cal-nav { width: 42px; height: 42px; min-height: 42px; padding: 0; border-radius: 10px; font-size: 20px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--text-faint); padding: 4px 0 8px; font-weight: 700; }
  .cal-day {
    aspect-ratio: 1 / 1; min-height: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--text); border: none; border-radius: 0;
    font-size: 14px; font-weight: 600;
  }
  .cal-day.empty { background: transparent; }
  .cal-day > i { font-style: normal; }
  .cal-day:disabled { color: var(--text-faint); opacity: .28; }
  /* range fill spans the full cell so consecutive days connect visually */
  .cal-day.inrange { background: rgba(181,98,60,.18); }
  .cal-day.start, .cal-day.end {
    background: rgba(181,98,60,.18);
  }
  .cal-day.start > i, .cal-day.end > i {
    background: var(--accent); color: #fff; font-style: normal;
    width: 84%; height: 84%; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-day.start { border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
  .cal-day.end { border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
  .cal-day.single { background: transparent; }
  .cal-legend { font-size: 13px; color: var(--text-dim); margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="brand">Eldorado Community<small>Morgan Hill, CA · Prototype</small></div>
  <div class="role">
    <select id="roleSelect" aria-label="Acting as">
      <!-- filled by JS -->
    </select>
  </div>
</header>

<main>
  <!-- ============ PATROL ============ -->
  <section id="screen-patrol" class="screen">
    <h1>Field Lookup</h1>
    <form id="lookupForm" autocomplete="off">
      <label class="field">
        <span>License plate</span>
        <input id="lookupPlate" class="mono" inputmode="text" autocapitalize="characters"
               placeholder="e.g. 7ABC123" style="font-size:22px; letter-spacing:2px; text-transform:uppercase;" />
      </label>
      <button class="btn-primary btn-block" type="submit">🔍 Look up plate</button>
    </form>
    <div id="lookupResult"></div>
  </section>

  <!-- ============ RESIDENT ============ -->
  <section id="screen-resident" class="screen">
    <h1 id="residentHello">My Parking</h1>

    <div class="seg" id="residentTabs" style="margin-bottom:14px;">
      <button data-rtab="permits" class="active">Guest permits</button>
      <button data-rtab="request">Request permit</button>
      <button data-rtab="pool">Reservations</button>
      <button data-rtab="violations">My violations</button>
      <button data-rtab="vehicles">My vehicles</button>
      <button data-rtab="renter">Renter</button>
    </div>

    <div id="rtab-permits"></div>
    <div id="rtab-request"></div>
    <div id="rtab-pool"></div>
    <div id="rtab-violations"></div>
    <div id="rtab-vehicles"></div>
    <div id="rtab-renter"></div>
  </section>

  <!-- ============ ADMIN ============ -->
  <section id="screen-admin" class="screen">
    <h1>Admin / Board</h1>
    <div class="seg" id="adminTabs" style="margin-bottom:14px;">
      <button data-atab="queue" class="active">Approvals</button>
      <button data-atab="permits">Permits</button>
      <button data-atab="violations">Violations</button>
      <button data-atab="unknown">Unknown plates</button>
      <button data-atab="owners">Homeowners</button>
      <button data-atab="audit">Audit log</button>
    </div>
    <div id="atab-queue"></div>
    <div id="atab-permits"></div>
    <div id="atab-violations"></div>
    <div id="atab-unknown"></div>
    <div id="atab-owners"></div>
    <div id="atab-audit"></div>
  </section>
</main>

<nav class="tabs" id="bottomNav">
  <button data-screen="patrol"><span class="ico">🔦</span>Patrol</button>
  <button data-screen="resident"><span class="ico">🏠</span>Resident</button>
  <button data-screen="admin"><span class="ico">🛡️</span>Admin</button>
</nav>

<!-- Modal host -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

function daysUntil(iso) { return Math.max(0, daysBetweenInclusive(todayISO, iso) - 1); }

/* Auto-expire renter access whose lease end date has passed (runs at boot). */
function expireRenters() {

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date((iso.length === 10 ? iso + "T12:00:00" : iso));
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function fmtDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso.length <= 16 && iso.includes("T") ? iso : iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function daysBetweenInclusive(startISO, endISO) {
  const a = new Date(startISO + "T00:00:00"), b = new Date(endISO + "T00:00:00");
  return Math.round((b - a) / 86400000) + 1;
}

function logAudit(entry) {

    id: uid("log"),
    at: nowStamp(),
    delivered: entry.delivered !== undefined ? entry.delivered : (entry.channel === "in-app" ? true : true),
  }, entry));
}

// All permits are guest-lot. Returns {instant:bool, reasons:[...]}.
function evaluatePermit({ plate, ownerId, startISO, endISO }) {
  const reasons = [];
  const duration = daysBetweenInclusive(startISO, endISO);

  // 1. Duration cap
  if (duration > CONFIG.MAX_PERMIT_DAYS) {
    reasons.push(`Duration is ${duration} days (self-serve limit is ${CONFIG.MAX_PERMIT_DAYS}).`);
  }

  // 2. Rolling 30-day self-serve permit-day cap (per homeowner)
  const windowStart = new Date(startISO + "T00:00:00");
  windowStart.setDate(windowStart.getDate() - 30);
  const usedDays = db.permits
    .filter(p => p.requested_by === ownerId && p.approval_type === "auto"
      && ["active", "approved", "expired"].includes(p.status)
      && new Date(p.end_date + "T00:00:00") >= windowStart)
    .reduce((sum, p) => sum + daysBetweenInclusive(p.start_date, p.end_date), 0);
  if (usedDays + duration > CONFIG.MAX_SELF_SERVE_DAYS_30) {
    reasons.push(`Would use ${usedDays + duration} self-serve permit-days in 30 days (limit ${CONFIG.MAX_SELF_SERVE_DAYS_30}).`);
  }

  // 3. No consecutive permits: start must not be within MIN_GAP_HOURS of a prior
  //    permit (same plate OR same homeowner) expiring.
  const newStart = new Date(startISO + "T00:00:00");
  const gapMs = CONFIG.MIN_GAP_HOURS * 3600000;
  const tooClose = db.permits.some(p => {
    if (!["active", "approved", "pending", "expired"].includes(p.status)) return false;
    if (p.plate !== plate && p.requested_by !== ownerId) return false;
    const priorEnd = new Date(p.end_date + "T23:59:59");
    const diff = newStart - priorEnd;
    return diff >= 0 && diff < gapMs;
  });
  if (tooClose) {
    reasons.push(`Starts within ${CONFIG.MIN_GAP_HOURS}h of a prior permit expiring (no back-to-back permits).`);
  }

  return { instant: reasons.length === 0, reasons, duration };
}

function submitPermitRequest({ plate, ownerId, startISO, endISO, notes, isGuest, guestDesc, guestState }) {
  const evalResult = evaluatePermit({ plate, ownerId, startISO, endISO });
  const owner = getOwner(ownerId);
  const permit = {
    id: uid("p"), plate, requested_by: ownerId, lot_type: PERMIT_LOT.id,
    start_date: startISO, end_date: endISO,
    status: evalResult.instant ? "active" : "pending",
    approval_type: evalResult.instant ? "auto" : "admin",
    created_at: nowStamp(), decided_by: null, notes: notes || "",
    is_guest: !!isGuest, guest_desc: guestDesc || "", guest_state: guestState || "",
  };
  db.permits.push(permit);
  const who = `guest vehicle ${plate}`;

  if (evalResult.instant) {
    logAudit({ entity_type: "permit", entity_id: permit.id, action: "permit_auto_approved",
      channel: "in-app", recipient: owner.email,
      detail: `Guest-lot permit for ${who} auto-approved (${evalResult.duration} day(s), within self-serve limits).` });
  } else {
    logAudit({ entity_type: "permit", entity_id: permit.id, action: "permit_requested",
      channel: "in-app", recipient: "Admin queue",
      detail: `Guest-lot permit for ${who} needs approval: ${evalResult.reasons.join(" ")}` });
  }
  return { permit, evalResult };
}

function decidePermit(permitId, decision, modifiedEnd) {
  const p = db.permits.find(x => x.id === permitId);
  if (!p) return;
  const owner = getOwner(p.requested_by);
  if (decision === "approve") {
    if (modifiedEnd) p.end_date = modifiedEnd;
    p.status = "active";
    p.decided_by = state.actingAs;
    logAudit({ entity_type: "permit", entity_id: p.id, action: "permit_approved",
      channel: "email", recipient: owner.email,
      detail: `Guest-lot permit approved by ${getOwner(state.actingAs).name}${modifiedEnd ? " (duration modified)" : ""}.` });
  } else {
    p.status = "denied";
    p.decided_by = state.actingAs;
    logAudit({ entity_type: "permit", entity_id: p.id, action: "permit_denied",
      channel: "email", recipient: owner.email,
      detail: `Guest-lot permit denied by ${getOwner(state.actingAs).name}.` });
  }
}

function hasActivePermit(plate) {
  return db.permits.find(p => p.plate === plate && p.status === "active"
    && p.end_date >= todayISO && p.start_date <= todayISO) || null;
}

/* =====================================================================
   POOL PARTY LOGIC  (gazebo reservation — board-approved per 2024 rules)
   ===================================================================== */
function partiesOf(ownerId) {
  return db.poolParties.filter(p => p.requested_by === ownerId)
    .sort((a, b) => (a.date < b.date ? 1 : -1));
}
function fmtTime(hhmm) {
  if (!hhmm) return "—";
  const [h, m] = hhmm.split(":").map(Number);
  const ap = h < 12 ? "AM" : "PM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${ap}`;
}
function minutesOf(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }

/* Validate a party request against the adopted pool rules.
   Returns { ok, issues:[...], conflict:bool }. */
function evaluatePoolParty({ date, start, end, guests, ignoreId }) {
  const P = CONFIG.POOL;
  const issues = [];
  const earliest = daysFromToday(P.ADVANCE_DAYS);
  if (!date) issues.push("Pick a date for the party.");
  else if (date < earliest) issues.push(`Requests must be at least ${P.ADVANCE_DAYS} days ahead (earliest ${fmtDate(earliest)}).`);
  const g = parseInt(guests, 10);
  if (!g || g < 1) issues.push("Enter the number of people attending.");
  else if (g > P.CAPACITY) issues.push(`Limit is ${P.CAPACITY} people total (including the host).`);
  if (!start || !end) issues.push("Set a start and end time.");
  else {
    if (minutesOf(end) <= minutesOf(start)) issues.push("End time must be after the start time.");
    else if (minutesOf(end) - minutesOf(start) > P.MAX_HOURS * 60) issues.push(`Parties are limited to ${P.MAX_HOURS} hours.`);
    if (minutesOf(start) < minutesOf(P.EARLIEST_START)) issues.push(`The pool opens at ${fmtTime(P.EARLIEST_START)}.`);
    if (minutesOf(end) > minutesOf(P.LATEST_END)) issues.push(`Parties must end by ${fmtTime(P.LATEST_END)}.`);
  }
  // Informational: another approved/pending party already on this date.
  const conflict = !!date && db.poolParties.some(p => p.id !== ignoreId && p.date === date
    && (p.status === "approved" || p.status === "pending"));
  return { ok: issues.length === 0, issues, conflict };
}

function submitPoolParty({ ownerId, date, start, end, guests, notes }) {
  const party = {
    id: uid("pp"), requested_by: ownerId, date, start_time: start, end_time: end,
    guest_count: parseInt(guests, 10), notes: notes || "", status: "pending",
    created_at: nowStamp(), decided_by: null, comment: "",
  };
  db.poolParties.push(party);
  const owner = getOwner(ownerId);
  logAudit({ entity_type: "pool_party", entity_id: party.id, action: "pool_party_requested",
    channel: "in-app", recipient: "Board queue",
    detail: `Pool-party (gazebo) request from ${owner.name} for ${fmtDate(date)} ${fmtTime(start)}–${fmtTime(end)}, ${party.guest_count} ppl. Needs board approval; $${CONFIG.POOL.DEPOSIT} deposit due.` });
  return party;
}

function decidePoolParty(partyId, decision, comment) {
  const p = db.poolParties.find(x => x.id === partyId);
  if (!p) return;
  const owner = getOwner(p.requested_by);
  p.decided_by = state.actingAs;

  if (decision === "approve") {

}

/* =====================================================================
   VIOLATION / STRIKE LOGIC  (strikes accrue per PLATE)
   ===================================================================== */
function strikeCountForPlate(plate) {
  return db.violations.filter(v => v.plate === plate && v.status !== "resolved").length;
}
function strikeCountForOwner(ownerId) {
  const plates = vehiclesOf(ownerId).map(v => v.plate);
  return db.violations.filter(v => plates.includes(v.plate) && v.status !== "resolved").length;
}
function violationsForPlate(plate) {
  return db.violations.filter(v => v.plate === plate)
    .sort((a, b) => (a.occurred_at < b.occurred_at ? 1 : -1));
}
function violationsForOwner(ownerId) {
  const plates = vehiclesOf(ownerId).map(v => v.plate);
  return db.violations.filter(v => plates.includes(v.plate))
    .sort((a, b) => (a.occurred_at < b.occurred_at ? 1 : -1));
}

function strikeLabel(n) {
  if (n <= 0) return "No strikes";
  if (n === 1) return "Strike 1 · Warning";
  if (n === 2) return "Strike 2 · Tow warning";
  return `Strike ${n} · Tow-eligible (admin discretion)`;
}
/* Graduated severity color for a strike count: 0 gray, 1 yellow, 2 orange, 3+ red. */
function strikeClass(n) { return n <= 0 ? "gray" : n === 1 ? "yellow" : n === 2 ? "orange" : "red"; }

function logViolation({ plate, ruleId, location, notes, photo }) {
  const nextStrike = strikeCountForPlate(plate) + 1;
  const status = nextStrike >= 3 ? "tow-eligible" : (nextStrike === 2 ? "escalated" : "issued");
  const v = {
    id: uid("v"), plate, rule_id: ruleId, location: location || "",
    occurred_at: nowStamp(), logged_by: state.actingAs,
    photo: photo || null,
    strike_number: nextStrike, status, notes: notes || "",
  };
  db.violations.push(v);

  const rule = getRule(ruleId);
  const owner = ownerOfPlate(plate);
  const action = nextStrike === 1 ? "warning_sent" : nextStrike === 2 ? "tow_warning_sent" : "tow_eligible_notice";
  const headline = nextStrike === 1 ? "Strike 1 warning" : nextStrike === 2 ? "Strike 2 TOW WARNING" : `Strike ${nextStrike} — tow-eligible`;

  if (owner) {
    logAudit({ entity_type: "violation", entity_id: v.id, action,
      channel: "email", recipient: owner.email, delivered: true,
      detail: `${headline} — ${rule.short_name}. Rule text sent to ${owner.name}.` });
  } else {
    // No owner on file: enforcement is a physical windshield notice — NOT an email
    // that waits indefinitely to be "linked". The strike still accrues to the plate,
    // so an unidentified vehicle still reaches tow-eligibility at strike 3.
    logAudit({ entity_type: "violation", entity_id: v.id, action: "notice_posted",
      channel: "notice", recipient: `Windshield · plate ${plate}`, delivered: true,
      detail: `${headline} — ${rule.short_name}. No owner on file; windshield notice posted. Strike accrues to the plate${nextStrike >= 3 ? " — vehicle is now tow-eligible." : "."}` });
  }
  return v;
}

function overrideViolation(violationId, newStatus, reason) {
  const v = db.violations.find(x => x.id === violationId);
  if (!v) return;
  const prev = v.status;
  v.status = newStatus;
  v.notes = (v.notes ? v.notes + " " : "") + `[Override: ${reason}]`;
  const owner = ownerOfPlate(v.plate);
  logAudit({ entity_type: "violation", entity_id: v.id, action: "violation_override",
    channel: "in-app", recipient: owner ? owner.email : `(plate ${v.plate})`,
    detail: `Status ${prev} → ${newStatus} by ${getOwner(state.actingAs).name}. Reason: ${reason}` });
}

function linkPlate(plate, ownerId) {
  const v = vehicleOfPlate(plate);
  if (v) v.homeowner_id = ownerId;
  const owner = getOwner(ownerId);
  logAudit({ entity_type: "vehicle", entity_id: plate, action: "plate_linked",
    channel: "in-app", recipient: owner.email,
    detail: `Plate ${plate} linked to ${owner.name} by ${getOwner(state.actingAs).name}.` });
  // Flush any queued notifications for this plate
  db.audit.filter(a => a.entity_type === "violation" && a.delivered === false
      && a.recipient.includes(plate))
    .forEach(a => {
      a.delivered = true;
      a.detail += ` [Auto-sent to ${owner.email} on link.]`;
    });
}

function renderLookup(plate) {
  plate = plate.trim().toUpperCase();
  const host = $("#lookupResult");
  if (!plate) { host.innerHTML = ""; return; }

  const permit = hasActivePermit(plate);
  const strikes = strikeCountForPlate(plate);
  const owner = ownerOfPlate(plate);
  const vehicle = vehicleOfPlate(plate);
  const recent = violationsForPlate(plate).slice(0, 3);
  // Permitted guest vehicle with no registered owner: attribute to the sponsor.
  const guestSponsor = (!owner && permit && permit.is_guest) ? getOwner(permit.requested_by) : null;

  const ok = !!permit;
  const nameLine = owner ? owner.name : guestSponsor ? `Guest of ${guestSponsor.name}` : "Unknown owner";
  const vehLine = vehicle ? `${vehicle.color} ${vehicle.make} ${vehicle.model} · ${vehicle.state}`
    : guestSponsor ? ((permit.guest_desc || "Guest vehicle") + (permit.guest_state ? " · " + permit.guest_state : "")) : "Vehicle not on file";
  const unitLine = owner ? owner.unit : guestSponsor ? guestSponsor.unit : "";
  let html = `
    <div class="status ${ok ? "ok" : "bad"}">
      <div class="row spread">
        <span class="plate lg">${escapeHtml(plate)}</span>
        <span class="pill ${ok ? "green" : "red"}">
          <span class="dot ${ok ? "green" : "red"}"></span>${ok ? "PERMIT ACTIVE" : "NO ACTIVE PERMIT"}
        </span>
      </div>
      <div class="big">${escapeHtml(nameLine)}${guestSponsor ? ` <span class="pill gray">Guest</span>` : ""}</div>
      <div class="sub">
        ${escapeHtml(vehLine)}${unitLine ? " · " + escapeHtml(unitLine) : ""}
      </div>
      ${permit ? `<div class="sub" style="margin-top:6px;">Guest-lot permit valid through ${fmtDate(permit.end_date)}</div>` : ""}
      <div class="row" style="margin-top:12px; gap:10px;">
        <div class="strikepips">
          ${[1,2,3].map(i => `<span class="pip ${i <= strikes ? "on s" + i : ""}"></span>`).join("")}
        </div>
        <strong>${escapeHtml(strikeLabel(strikes))}</strong>
      </div>
    </div>`;

  html += `<h2>Recent violations</h2>`;
  if (recent.length === 0) {
    html += `<div class="card"><div class="empty">No violations on record for this plate.</div></div>`;
  } else {
    html += `<div class="card">` + recent.map(v => {
      const r = getRule(v.rule_id);
      return `<div class="listitem" style="cursor:pointer;" onclick="openViolationDetail('${v.id}')">
        <div class="row spread">
          <strong>#${v.strike_number} · ${escapeHtml(r.short_name)}</strong>
          ${statusPill(v.status)}
        </div>
        <div class="meta">${fmtDateTime(v.occurred_at)} · ${escapeHtml(v.location || "no location")}${v.photo ? " · 📷" : ""} · <span class="link">View ›</span></div>
      </div>`;
    }).join("") + `</div>`;
  }

  if (!owner && guestSponsor) {
    html += `<div class="notice info">🚗 Guest vehicle sponsored by <strong>${escapeHtml(guestSponsor.name)}</strong> (${escapeHtml(guestSponsor.unit)}) under an active guest-lot permit.</div>`;
  } else if (!owner) {
    html += `<div class="notice warn">⚠ No owner on file for this plate. Place a windshield notice — strikes still accrue to the plate and it becomes tow-eligible at strike 3. If the owner is later identified, an admin can link the plate.</div>`;
  }

  html += `<button class="btn-danger btn-block" style="margin-top:6px;" onclick="openLogViolation('${escapeHtml(plate)}')">⚠️ Log Violation</button>`;

  host.innerHTML = html;
}

function statusPill(status) {
  const map = {
    issued: ["yellow", "Issued"], escalated: ["orange", "Escalated"],
    "tow-eligible": ["red", "Tow-eligible"], resolved: ["gray", "Resolved"],
    active: ["green", "Active"], pending: ["amber", "Pending"],
    approved: ["green", "Approved"], denied: ["red", "Denied"], expired: ["gray", "Expired"],
  };
  const [cls, label] = map[status] || ["gray", status];
  return `<span class="pill ${cls}">${escapeHtml(label)}</span>`;
}

/* ---------- LOG VIOLATION modal ---------- */
function openLogViolation(plate) {
  const rulesHtml = db.rules.map(r => `
    <button class="rule-btn" onclick="selectRule('${escapeHtml(plate)}','${r.id}')">
      ${escapeHtml(r.short_name)}
      <small>${escapeHtml(r.full_explanation_text.slice(0, 80))}…</small>
    </button>`).join("");
  openModal(`
    <h3>Log violation</h3>
    <p class="muted">Plate <span class="plate">${escapeHtml(plate)}</span> · next strike <strong>#${strikeCountForPlate(plate) + 1}</strong></p>
    <h2 style="margin-top:14px;">Pick a rule</h2>
    ${rulesHtml}
    <button class="btn-ghost btn-block" onclick="closeModal()">Cancel</button>
  `);
}

function selectRule(plate, ruleId) {
  const rule = getRule(ruleId);
  const nextStrike = strikeCountForPlate(plate) + 1;
  openModal(`
    <h3>Confirm violation</h3>
    <p class="muted">Plate <span class="plate">${escapeHtml(plate)}</span></p>
    <div class="notice info"><strong>${escapeHtml(rule.short_name)}</strong><br>${escapeHtml(rule.full_explanation_text)}</div>
    <div class="notice ${nextStrike >= 3 ? "warn" : nextStrike === 2 ? "warn" : "good"}">
      This will be <strong>${escapeHtml(strikeLabel(nextStrike))}</strong> for this plate.
    </div>
    <label class="field"><span>Location</span>
      <input id="vLoc" placeholder="e.g. Guest Lot B, stall 14" /></label>
    ${ruleId === "r5" ? `<label class="field"><span>Note (required for catch-all)</span><textarea id="vNote" placeholder="Describe the violation…"></textarea></label>`
                       : `<label class="field"><span>Note (optional)</span><textarea id="vNote"></textarea></label>`}
    <label class="field"><span>Photo</span>
      <label class="btn btn-block" style="cursor:pointer;" id="vPhotoBtn">
        📷 Attach photo <input id="vPhoto" type="file" accept="image/*" capture="environment" hidden onchange="previewViolationPhoto(this)">
      </label>
      <div id="vPhotoPreview"></div>
    </label>
    <button class="btn-danger btn-block" onclick="confirmViolation('${escapeHtml(plate)}','${ruleId}')">Issue violation &amp; notify</button>
    <button class="btn-ghost btn-block" style="margin-top:8px;" onclick="openLogViolation('${escapeHtml(plate)}')">← Back</button>
  `);
}

function confirmViolation(plate, ruleId) {
  const note = ($("#vNote") && $("#vNote").value || "").trim();
  if (ruleId === "r5" && !note) { alert("A note is required for the general catch-all rule."); return; }
  const fileInput = $("#vPhoto");
  const file = fileInput && fileInput.files && fileInput.files[0];
  const location = ($("#vLoc") && $("#vLoc").value) || "";

  const finish = (photo) => {
    const v = logViolation({ plate, ruleId, location, notes: note, photo });
    const owner = ownerOfPlate(plate);
    closeModal();
    openModal(`
      <h3>✅ Violation logged</h3>
      <div class="notice ${strikeClass(v.strike_number)}">
        <strong>${escapeHtml(strikeLabel(v.strike_number))}</strong> recorded for <span class="plate">${escapeHtml(plate)}</span>.<br>
        ${owner ? `Notification emailed to ${escapeHtml(owner.name)} (${escapeHtml(owner.email)}).`
                : `No owner on file — place a windshield notice on the vehicle. The strike is recorded against the plate.`}
        ${photo ? "<br>📷 Photo saved to the violation record." : ""}
      </div>
      <button class="btn-ghost btn-block" onclick="openViolationDetail('${v.id}')">View violation</button>
      <button class="btn-primary btn-block" style="margin-top:8px;" onclick="closeModal()">Done</button>
    `);
    renderLookup(plate);
  };

  // Read the captured photo into a data URL so it's stored with the violation.
  if (file) {
    const reader = new FileReader();
    reader.onload = () => finish(reader.result);
    reader.onerror = () => { alert("Couldn't read the photo; logging without it."); finish(null); };
    reader.readAsDataURL(file);
  } else {
    finish(null);
  }
}

/* Live thumbnail + confirmation when a patrol photo is captured (before issuing). */
function previewViolationPhoto(input) {
  const host = $("#vPhotoPreview");
  const btn = $("#vPhotoBtn");
  const file = input.files && input.files[0];
  if (!host) return;
  if (!file) { host.innerHTML = ""; if (btn) btn.firstChild.textContent = "📷 Attach photo "; return; }
  const reader = new FileReader();
  reader.onload = () => {
    host.innerHTML = `
      <div class="card tight" style="margin-top:8px;">
        <div class="row spread" style="margin-bottom:8px;">
          <span class="pill green"><span class="dot green"></span>Photo attached</span>
          <button type="button" class="btn-sm btn-ghost" onclick="clearViolationPhoto()">Remove</button>
        </div>
        <img src="${reader.result}" alt="Photo preview" style="width:100%; border-radius:10px; border:1px solid var(--line); display:block;">
      </div>`;
    if (btn) btn.firstChild.textContent = "📷 Replace photo ";
  };
  reader.onerror = () => { host.innerHTML = `<div class="notice warn" style="margin-top:8px;">Couldn't read that image — try again.</div>`; };
  reader.readAsDataURL(file);
}
function clearViolationPhoto() {
  const input = $("#vPhoto");
  if (input) input.value = "";
  const host = $("#vPhotoPreview"); if (host) host.innerHTML = "";
  const btn = $("#vPhotoBtn"); if (btn) btn.firstChild.textContent = "📷 Attach photo ";
}

      <span class="plate lg">${escapeHtml(v.plate)}</span>
      ${statusPill(v.status)}
    </div>
    <div class="row" style="margin-bottom:10px;"><span class="pill ${strikeClass(v.strike_number)}"><span class="dot ${strikeClass(v.strike_number)}"></span>${escapeHtml(strikeLabel(v.strike_number))}</span></div>

    ${v.photo
      ? `<img src="${v.photo}" alt="Violation photo" style="width:100%; border-radius:12px; border:1px solid var(--line); margin:8px 0; display:block;">`
      : `<div class="card" style="text-align:center; color:var(--text-faint);">No photo attached</div>`}

    <div class="card tight">
      <div class="row spread"><span class="muted">Rule</span><strong style="text-align:right;">${escapeHtml(r.short_name)}</strong></div>
      <div class="meta" style="margin-top:8px;">${escapeHtml(r.full_explanation_text)}</div>
    </div>
    <div class="card tight">
      <div class="row spread"><span class="muted">When</span><span>${fmtDateTime(v.occurred_at)}</span></div>
      <div class="row spread" style="margin-top:8px;"><span class="muted">Where</span><span style="text-align:right;">${escapeHtml(v.location || "—")}</span></div>
      <div class="row spread" style="margin-top:8px;"><span class="muted">Owner</span><span style="text-align:right;">${owner ? escapeHtml(owner.name) : "Unknown — no owner on file"}</span></div>
      ${vehicle ? `<div class="row spread" style="margin-top:8px;"><span class="muted">Vehicle</span><span style="text-align:right;">${escapeHtml(`${vehicle.color} ${vehicle.make} ${vehicle.model} · ${vehicle.state}`)}</span></div>` : ""}
      <div class="row spread" style="margin-top:8px;"><span class="muted">Logged by</span><span style="text-align:right;">${escapeHtml(loggedBy ? loggedBy.name : "—")}</span></div>
    </div>
    ${v.notes ? `<div class="card tight"><span class="muted">Notes</span><div style="margin-top:6px;">${escapeHtml(v.notes)}</div></div>` : ""}

    ${admin ? `<div class="row wrap" style="gap:8px; margin-top:4px;">
      ${v.status !== "resolved" ? `<button class="btn-sm" onclick="closeModal(); overridePrompt('${v.id}','resolved')">Mark resolved</button>` : ""}
      ${!owner ? `<button class="btn-sm btn-primary" onclick="closeModal(); linkPrompt('${escapeHtml(v.plate)}')">Link plate to owner</button>` : ""}
    </div>` : ""}
    <button class="btn-primary btn-block" style="margin-top:10px;" onclick="closeModal()">Close</button>
  `);
}

/* ---------- RESIDENT ---------- */
function renderResident() {
  const u = currentUser();
  const renterMode = isRenter(u);
  $("#residentHello").textContent = `${u.name.split(" ")[0]}'s Parking`;

  // The "Renter" management tab is for owners only.
  const renterTabBtn = document.querySelector('#residentTabs button[data-rtab="renter"]');
  if (renterTabBtn) renterTabBtn.hidden = renterMode;
  if (renterMode && state.rtab === "renter") state.rtab = "permits";

  document.querySelectorAll('#residentTabs button').forEach(b =>
    b.classList.toggle("active", b.dataset.rtab === state.rtab));
  ["permits", "request", "pool", "violations", "vehicles", "renter"].forEach(t =>
    $("#rtab-" + t).style.display = t === state.rtab ? "block" : "none");

  if (state.rtab === "permits") renderResidentPermits();
  if (state.rtab === "request") renderRequestForm();
  if (state.rtab === "pool") renderResidentPool();
  if (state.rtab === "violations") renderResidentViolations();
  if (state.rtab === "vehicles") renderResidentVehicles();
  if (state.rtab === "renter") renderRenterManage();
}

/* ---------- Inline range calendar (single-open start→end picker) ---------- */
const CAL_DOW = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
const CAL_MON = ["January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"];

function isoOf(y, m, d) { // m is 0-based
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
function parseISO(iso) { const [y, m, d] = iso.split("-").map(Number); return { y, m: m - 1, d }; }

function curYM() { const t = parseISO(todayISO); return { y: t.y, m: t.m }; }

function renderRangeCalendar() {
  const pk = state.picker;
  if (!pk.view) { const t = parseISO(pk.start || todayISO); pk.view = { y: t.y, m: t.m }; }
  const { y, m } = pk.view;
  const startDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const floor = curYM();
  const atFloor = (y < floor.y) || (y === floor.y && m <= floor.m); // never navigate before this month

  let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = isoOf(y, m, d);
    const past = iso < todayISO;
    let cls = "cal-day";
    if (pk.start && pk.end) {
      if (iso === pk.start) cls += " start";
      if (iso === pk.end) cls += " end";
      if (iso === pk.start && iso === pk.end) cls += " single";
      if (iso > pk.start && iso < pk.end) cls += " inrange";
    } else if (pk.start && iso === pk.start) {
      cls += " start end single";
    }
    cells += `<button type="button" class="${cls}" data-iso="${iso}" ${past ? "disabled" : ""}><i>${d}</i></button>`;
  }

  return `<div class="cal">
    <div class="cal-head">
      <button type="button" class="btn cal-nav" data-nav="-1" ${atFloor ? "disabled" : ""} aria-label="Previous month">‹</button>
      <span class="mname">${CAL_MON[m]} ${y}</span>
      <button type="button" class="btn cal-nav" data-nav="1" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid">
      ${CAL_DOW.map(d => `<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
    <div class="cal-legend">${calLegend()}</div>
  </div>`;
}

function calLegend() {
  const pk = state.picker;
  if (!pk.start) return "Tap your <strong>first</strong> night.";
  if (!pk.end) return `Start <strong>${fmtDate(pk.start)}</strong> — now tap the <strong>last</strong> night.`;
  return `<strong>${fmtDate(pk.start)} → ${fmtDate(pk.end)}</strong> · ${daysBetweenInclusive(pk.start, pk.end)} day(s)`;
}

function drawCalendar() { const host = $("#calHost"); if (host) host.innerHTML = renderRangeCalendar(); }

function pickDay(iso) {
  const pk = state.picker;
  if (!pk.start || pk.end) { pk.start = iso; pk.end = null; }   // start a fresh range
  else if (iso < pk.start) { pk.start = iso; }                  // tapped before start → new start
  else { pk.end = iso; }                                        // complete the range
  drawCalendar();
  previewPermit();
}

function calMove(delta) {
  const pk = state.picker;
  let { y, m } = pk.view;
  m += delta;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  pk.view = { y, m };
  drawCalendar();
}

/* One delegated click handler bound to the stable #calHost container.
   #calHost itself is never replaced (only its innerHTML), so this listener
   survives every re-render and there are no per-cell inline handlers. */
function onCalClick(e) {
  const nav = e.target.closest("[data-nav]");
  if (nav) { if (!nav.disabled) calMove(parseInt(nav.dataset.nav, 10)); return; }
  const day = e.target.closest("[data-iso]");
  if (day && !day.disabled) pickDay(day.dataset.iso);
}

  }
  $("#rtab-request").innerHTML = `
    <div class="card">
      <div class="notice info">Guest-lot overnight permits are for your <strong>visitors</strong>. Residents park in their own garage/driveway — overnight street parking (12am–5am) is never permitted.</div>
      <div style="margin:12px 0;">
        <span style="display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px;">Guest vehicle</span>
        <label class="field" style="margin-top:0;"><span>Plate</span><input id="reqGuestPlate" class="mono" autocapitalize="characters" style="text-transform:uppercase;" placeholder="e.g. 8XYZ999"></label>
        <div class="grid2">
          <label class="field"><span>State</span><input id="reqGuestState" value="CA" maxlength="2" autocapitalize="characters"></label>
          <label class="field"><span>Color</span><input id="reqGuestColor" placeholder="Silver"></label>
        </div>
        <div class="grid2">
          <label class="field"><span>Make</span><input id="reqGuestMake" placeholder="Toyota"></label>
          <label class="field"><span>Model</span><input id="reqGuestModel" placeholder="Camry"></label>
        </div>

      </div>
      <label class="field"><span>Dates</span><div id="calHost"></div></label>
      <label class="field"><span>Notes (optional)</span><textarea id="reqNotes" placeholder="Anything the board should know"></textarea></label>
      <div id="reqPreview"></div>

  const host = $("#calHost");

  $("#reqGuestPlate") && $("#reqGuestPlate").addEventListener("input", previewPermit);

/* Reads the guest vehicle from the request form (all permits are guest permits). */
function getReqInput() {
  const val = sel => (($(sel) && $(sel).value) || "").trim();
  const color = val("#reqGuestColor"), make = val("#reqGuestMake"), model = val("#reqGuestModel");
  return {
    plate: val("#reqGuestPlate").toUpperCase(),
    isGuest: true,
    guestDesc: [color, make, model].filter(Boolean).join(" "), // matches "Color Make Model"
    guestState: (val("#reqGuestState") || "CA").toUpperCase(),
  };
}

function previewPermit() {
  const u = currentUser();
  const plate = getReqInput().plate;
  const pk = state.picker || {};
  const startISO = pk.start, endISO = pk.end;
  const host = $("#reqPreview");
  if (!host) return;
  if (!plate || !startISO || !endISO) { host.innerHTML = ""; return; }
  if (endISO < startISO) { host.innerHTML = `<div class="notice warn">End date is before start date.</div>`; return; }
  const ev = evaluatePermit({ plate, ownerId: u.id, startISO, endISO });
  if (ev.instant) {
    host.innerHTML = `<div class="notice good">✅ Instant approval — ${ev.duration} day(s), within self-serve limits.</div>`;
  } else {
    host.innerHTML = `<div class="notice warn">⏳ Needs board approval:<ul style="margin:6px 0 0 18px;padding:0;">${ev.reasons.map(r => `<li>${escapeHtml(r)}</li>`).join("")}</ul></div>`;
  }
}

function doRequestPermit() {
  const u = currentUser();
  const { plate, isGuest, guestDesc, guestState } = getReqInput();
  const pk = state.picker || {};
  const startISO = pk.start, endISO = pk.end;
  if (!plate) { alert("Enter the guest's license plate."); return; }
  if (!startISO || !endISO || endISO < startISO) { alert("Pick a start and end date on the calendar."); return; }
  const { evalResult } = submitPermitRequest({ plate, ownerId: u.id, startISO, endISO, notes: $("#reqNotes").value, isGuest, guestDesc, guestState });
  state.picker = null; // reset for next time
  openModal(`
    <h3>${evalResult.instant ? "✅ Permit active" : "⏳ Request submitted"}</h3>
    <div class="notice ${evalResult.instant ? "good" : "info"}">
      ${evalResult.instant
        ? `Your guest-lot permit for ${escapeHtml(plate)} was auto-approved and is active.`
        : "Your request was sent to the board for approval. You’ll be notified by email."}
    </div>
    <button class="btn-primary btn-block" onclick="closeModal(); state.rtab='permits'; render();">View my permits</button>
  `);
}

      const r = getRule(v.rule_id);

        <div class="row spread">
          <strong>${escapeHtml(r.short_name)}</strong>${statusPill(v.status)}
        </div>

/* ---------- POOL PARTY (resident) ---------- */
function renderResidentPool() {
  const u = currentUser();
  const host = $("#rtab-pool");
  const P = CONFIG.POOL;

  // A homeowner who has leased out the home relinquishes pool privileges to the renter.
  const renter = activeRenterFor(u.id);
  if (renter) {
    host.innerHTML = `<div class="card"><div class="notice warn">🔑 This unit is leased to <strong>${escapeHtml(renter.name)}</strong>. Per the pool rules, pool privileges transfer to the renter while the lease is active.</div></div>`;
    return;
  }

  if (!state.party) state.party = { date: "", start: "14:00", end: "17:00", guests: "", notes: "", agreeRules: false, agreeDeposit: false };
  const pr = state.party;
  const earliest = daysFromToday(P.ADVANCE_DAYS);
  const mine = partiesOf(u.id);

  const listHtml = mine.map(p => `
    <div class="listitem">
      <div class="row spread"><strong>${fmtDate(p.date)}</strong>${statusPill(p.status)}</div>
      <div class="meta">${fmtTime(p.start_time)}–${fmtTime(p.end_time)} · ${p.guest_count} people${p.notes ? " · " + escapeHtml(p.notes) : ""}</div>
      ${p.comment ? `<div class="meta">Board: “${escapeHtml(p.comment)}”</div>` : ""}
    </div>`).join("");

  host.innerHTML = `
    ${isRenter(u) ? renterLeaseHtml(u) : ""}
    <div class="card">
      <h2 style="margin-top:0;">Reserve the pool gazebo</h2>
      <div class="notice info">Reserves the <strong>gazebo area</strong> for your party. The pool/spa stay open to other residents up to the ${P.CAPACITY}-person capacity. Every request goes to the board for approval.</div>
      <label class="field"><span>Date</span><input id="ppDate" type="date" min="${earliest}" value="${pr.date}"></label>
      <label class="field"><span>Start time</span><input id="ppStart" type="time" value="${pr.start}"></label>
      <label class="field"><span>End time (max ${P.MAX_HOURS}h, by ${fmtTime(P.LATEST_END)})</span><input id="ppEnd" type="time" value="${pr.end}"></label>
      <label class="field"><span>People attending (max ${P.CAPACITY}, including you)</span><input id="ppGuests" type="number" inputmode="numeric" min="1" max="${P.CAPACITY}" value="${pr.guests}"></label>
      <label class="field"><span>Notes (type of party, etc.)</span><textarea id="ppNotes" placeholder="Optional">${escapeHtml(pr.notes || "")}</textarea></label>

      <div id="ppPreview"></div>

      <div class="notice warn" style="font-size:12.5px;">
        <strong>Pool party rules</strong>
        <ul style="margin:6px 0 0 18px; padding:0;">
          <li>Submit at least ${P.ADVANCE_DAYS} days ahead; the board approves every party.</li>
          <li>Up to ${P.CAPACITY} people total · ${P.MAX_HOURS}-hour max · must end by ${fmtTime(P.LATEST_END)}.</li>
          <li>$${P.DEPOSIT} deposit due with the request, held until the area is inspected.</li>
          <li>You (the host) must be present the whole time and have approval available on request.</li>
          <li>You're responsible for cleanup and any damage.</li>
        </ul>
      </div>
      <label class="row" style="gap:10px; align-items:flex-start; margin:10px 0;"><input id="ppAgree" type="checkbox" style="width:auto; min-height:0;" ${pr.agreeRules ? "checked" : ""}><span class="muted" style="font-size:13px;">I have read and agree to abide by all pool rules, plus local, county and state laws.</span></label>
      <label class="row" style="gap:10px; align-items:flex-start; margin:10px 0;"><input id="ppDeposit" type="checkbox" style="width:auto; min-height:0;" ${pr.agreeDeposit ? "checked" : ""}><span class="muted" style="font-size:13px;">I understand a $${P.DEPOSIT} deposit is required and I must be present for the entire party.</span></label>

    </div>
    ${mine.length ? `<h2>My reservations</h2><div class="card">${listHtml}</div>` : ""}
  `;
  // The end time is bounded to the allowed window (start is never moved to fit it).
  $("#ppStart").addEventListener("change", updatePartyTimes);
  $("#ppEnd").addEventListener("change", updatePartyTimes);
  ["ppDate", "ppGuests", "ppNotes", "ppAgree", "ppDeposit"].forEach(id => {
    const el = $("#" + id); if (el) el.addEventListener("input", previewPoolParty);
  });
  updatePartyTimes(); // set bounds + normalize on load
}

function hhmmOf(min) {
  min = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
}

/* Start is anchored to whatever the host picks (only bounded to pool hours).
   The End picker's selectable range is limited to (start … start+3h, capped at
   8pm) so anything past the max is greyed out — the start never shifts. */
function updatePartyTimes() {
  const P = CONFIG.POOL, maxLen = P.MAX_HOURS * 60;
  const open = minutesOf(P.EARLIEST_START), close = minutesOf(P.LATEST_END);
  const sEl = $("#ppStart"), eEl = $("#ppEnd");
  if (!sEl || !eEl) return;
  let s = minutesOf(sEl.value || "14:00"), e = minutesOf(eEl.value || "17:00");

  s = Math.min(Math.max(s, open), close - 30); // start within pool hours only
  const eMax = Math.min(s + maxLen, close);
  if (e > eMax || e <= s) e = eMax;            // end follows; start untouched

  sEl.min = hhmmOf(open); sEl.max = hhmmOf(close - 30);
  eEl.min = hhmmOf(s); eEl.max = hhmmOf(eMax); // greys out times past the max
  sEl.value = hhmmOf(s); eEl.value = hhmmOf(e);
  if (state.party) { state.party.start = sEl.value; state.party.end = eEl.value; }
  previewPoolParty();
}

function previewPoolParty() {
  const pr = state.party; if (!pr) return;
  // keep state in sync so data survives re-renders
  if ($("#ppDate")) {
    pr.date = $("#ppDate").value; pr.start = $("#ppStart").value; pr.end = $("#ppEnd").value;
    pr.guests = $("#ppGuests").value; pr.notes = $("#ppNotes").value;
    pr.agreeRules = $("#ppAgree").checked; pr.agreeDeposit = $("#ppDeposit").checked;
  }
  const host = $("#ppPreview"); if (!host) return;
  const ev = evaluatePoolParty({ date: pr.date, start: pr.start, end: pr.end, guests: pr.guests });
  let html = "";
  if (ev.conflict) html += `<div class="notice info">Another party is already requested/approved for ${fmtDate(pr.date)} — the board will check combined capacity.</div>`;
  if (!pr.date && !pr.guests) { host.innerHTML = html; return; }
  if (ev.ok) html += `<div class="notice good">✅ Looks good — this will go to the board for approval.</div>`;
  else html += `<div class="notice warn">Please fix:<ul style="margin:6px 0 0 18px;padding:0;">${ev.issues.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul></div>`;
  host.innerHTML = html;
}

function doSubmitPoolParty() {
  const u = currentUser();
  const pr = state.party || {};
  const ev = evaluatePoolParty({ date: pr.date, start: pr.start, end: pr.end, guests: pr.guests });
  if (!ev.ok) { alert("Please fix:\n• " + ev.issues.join("\n• ")); return; }
  if (!pr.agreeRules || !pr.agreeDeposit) { alert("Please acknowledge the pool rules and the deposit requirement."); return; }
  submitPoolParty({ ownerId: u.id, date: pr.date, start: pr.start, end: pr.end, guests: pr.guests, notes: pr.notes });
  state.party = null;
  openModal(`
    <h3>⏳ Request submitted</h3>
    <div class="notice info">Your pool-party request was sent to the board. You'll be notified by email once it's reviewed. The $${CONFIG.POOL.DEPOSIT} deposit is due with the request.</div>

  `);
}

function addVehicle() {
  const plate = ($("#nvPlate").value || "").trim().toUpperCase();
  if (!plate) { alert("Plate is required."); return; }
  const existing = vehicleOfPlate(plate);
  if (existing && !existing.deleted_at) { alert("That plate already exists."); return; }

  const details = {
    state: ($("#nvState").value || "CA").toUpperCase(),
    make: $("#nvMake").value || "", model: $("#nvModel").value || "",
    color: $("#nvColor").value || "",
  };

  if (existing && existing.deleted_at) {
    // Re-adding a plate that was removed within the retention window → restore it.
    existing.deleted_at = null;
    existing.homeowner_id = state.actingAs;
    Object.assign(existing, details);
    logAudit({ entity_type: "vehicle", entity_id: plate, action: "vehicle_restored",
      channel: "in-app", recipient: currentUser().email,
      detail: `Vehicle ${plate} restored from retained records by ${currentUser().name}.` });
    render();
    return;
  }

  db.vehicles.push(Object.assign({ plate, homeowner_id: state.actingAs, deleted_at: null }, details));
  logAudit({ entity_type: "vehicle", entity_id: plate, action: "vehicle_added",
    channel: "in-app", recipient: currentUser().email, detail: `Vehicle ${plate} added.` });
  render();
}

/* Soft-delete: the vehicle leaves the resident's account immediately, but the
   record (and its violation/permit history) is retained for CONFIG.VEHICLE_RETENTION_DAYS
   so any open enforcement or dispute still resolves, then it is purged at boot. */
function deleteVehicle(plate) {
  const v = vehicleOfPlate(plate);
  if (!v) return;
  v.deleted_at = nowStamp();
  logAudit({ entity_type: "vehicle", entity_id: plate, action: "vehicle_removed",
    channel: "in-app", recipient: currentUser().email,
    detail: `Vehicle ${plate} removed by ${currentUser().name}. Record retained ${CONFIG.VEHICLE_RETENTION_DAYS} days for enforcement history, then permanently deleted.` });
}

function confirmDeleteVehicle(plate) {
  const open = db.permits.filter(p => p.plate === plate && (p.status === "active" || p.status === "pending"));
  openModal(`
    <h3>Remove vehicle?</h3>
    <p class="muted">Plate <span class="plate">${escapeHtml(plate)}</span></p>
    ${open.length ? `<div class="notice warn">This vehicle has ${open.length} active/pending permit(s). Removing it won't cancel them automatically.</div>` : ""}
    <div class="notice info">It's removed from your account right away. Its violation &amp; permit history is kept for <strong>${CONFIG.VEHICLE_RETENTION_DAYS} days</strong> (in case of an open enforcement or dispute), then permanently deleted. You can re-add the same plate to restore it during that window.</div>
    <button class="btn-danger btn-block" onclick="doDeleteVehicle('${escapeHtml(plate)}')">Remove vehicle</button>
    <button class="btn-ghost btn-block" style="margin-top:8px;" onclick="closeModal()">Cancel</button>
  `);
}
function doDeleteVehicle(plate) { deleteVehicle(plate); closeModal(); render(); }

/* Purge soft-deleted vehicles past the retention window (runs at boot). */
function purgeExpiredVehicles() {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - CONFIG.VEHICLE_RETENTION_DAYS);
  const cutoffISO = cutoff.toISOString().slice(0, 10);
  db.vehicles = db.vehicles.filter(v => !(v.deleted_at && v.deleted_at.slice(0, 10) < cutoffISO));
}

  const cur = host.dataset.filter || "all";
  const list = db.violations
    .filter(v => cur === "all" ? true : v.status === cur)
    .sort((a, b) => (a.occurred_at < b.occurred_at ? 1 : -1));
  host.innerHTML = `
    <div class="seg" style="margin-bottom:12px;">
      ${filters.map(f => `<button class="${f === cur ? "active" : ""}" onclick="$('#atab-violations').dataset.filter='${f}'; renderAdminViolations();">${f}</button>`).join("")}
    </div>` +
    (list.length === 0 ? `<div class="card"><div class="empty">No violations match.</div></div>` :
    list.map(v => {
      const r = getRule(v.rule_id);
      const owner = ownerOfPlate(v.plate);
      return `<div class="card">
        <div class="row spread">
          <span class="plate">${escapeHtml(v.plate)}</span>${statusPill(v.status)}
        </div>
        <div style="margin-top:6px;"><strong>#${v.strike_number} · ${escapeHtml(r.short_name)}</strong></div>
        <div class="meta">${escapeHtml(owner ? owner.name : "UNKNOWN owner")} · ${fmtDateTime(v.occurred_at)} · ${escapeHtml(v.location || "no location")}${v.photo ? " · 📷" : ""}</div>
        ${v.notes ? `<div class="meta">Note: ${escapeHtml(v.notes)}</div>` : ""}
        <div class="row wrap" style="margin-top:10px; gap:8px;">
          <button class="btn-sm btn-ghost" onclick="openViolationDetail('${v.id}')">View ${v.photo ? "📷 " : ""}details</button>
          ${v.status !== "resolved" ? `<button class="btn-sm" onclick="overridePrompt('${v.id}','resolved')">Mark resolved</button>` : ""}
          <button class="btn-sm btn-ghost" onclick="overridePrompt('${v.id}','issued')">Reset to strike 1</button>
          ${!owner ? `<button class="btn-sm btn-primary" onclick="linkPrompt('${escapeHtml(v.plate)}')">Link plate to owner</button>` : ""}
        </div>
      </div>`;
    }).join(""));
}

function overridePrompt(violationId, newStatus) {
  openModal(`
    <h3>Override — reason required</h3>
    <p class="muted">New status: <strong>${escapeHtml(newStatus)}</strong></p>
    <label class="field"><span>Reason (logged to audit trail)</span><textarea id="ovReason" placeholder="e.g. Resident provided valid permit; cited in error."></textarea></label>
    <button class="btn-primary btn-block" onclick="doOverride('${violationId}','${newStatus}')">Apply override</button>
    <button class="btn-ghost btn-block" style="margin-top:8px;" onclick="closeModal()">Cancel</button>
  `);
}
function doOverride(violationId, newStatus) {
  const reason = ($("#ovReason").value || "").trim();
  if (!reason) { alert("A reason is required for any override."); return; }
  overrideViolation(violationId, newStatus, reason);
  closeModal(); render();
}

function linkPrompt(plate) {
  const opts = db.homeowners.map(h => `<option value="${h.id}">${escapeHtml(h.name)} — ${escapeHtml(h.unit)}</option>`).join("");
  openModal(`
    <h3>Link plate to owner</h3>
    <p class="muted">Plate <span class="plate">${escapeHtml(plate)}</span></p>
    <label class="field"><span>Homeowner</span><select id="linkOwner">${opts}</select></label>
    <div class="notice info">Linking associates this plate with the owner, so future notices reach them by email and the violation history is attributed to them.</div>
    <button class="btn-primary btn-block" onclick="doLink('${escapeHtml(plate)}')">Link</button>
    <button class="btn-ghost btn-block" style="margin-top:8px;" onclick="closeModal()">Cancel</button>
  `);
}
function doLink(plate) {
  linkPlate(plate, $("#linkOwner").value);
  closeModal(); render();
}

function renderAdminOwners() {
  $("#atab-owners").innerHTML = db.homeowners.map(h => {
    const plates = vehiclesOf(h.id);
    const strikes = strikeCountForOwner(h.id);
    const rolePill = h.role === "admin" ? `<span class="pill gray">${h.patrol ? "patrol" : "admin"}</span>`
      : isRenter(h) ? `<span class="pill ${isRenterActive(h) ? "amber" : "gray"}">renter${isRenterActive(h) ? "" : " · ended"}</span>` : "";
    const sp = isRenter(h) ? sponsorOf(h) : null;
    return `<div class="card">
      <div class="row spread">
        <div><strong>${escapeHtml(h.name)}</strong> ${rolePill}
          <div class="meta">${escapeHtml(h.unit)} · ${escapeHtml(h.email)}</div>
          ${isRenter(h) ? `<div class="meta">Renting from ${escapeHtml(sp ? sp.name : "?")} · lease ${isRenterActive(h) ? "ends" : "ended"} ${fmtDate(h.lease_end)}</div>` : ""}
          ${!isRenter(h) && activeRenterFor(h.id) ? `<div class="meta">🔑 Leased to ${escapeHtml(activeRenterFor(h.id).name)} (parking paused)</div>` : ""}
        </div>
        <span class="pill ${strikeClass(strikes)}">${strikes} strike(s)</span>
      </div>
      <div class="meta" style="margin-top:8px;">Vehicles: ${plates.length ? plates.map(p => `<span class="plate" style="font-size:12px;">${escapeHtml(p.plate)}</span>`).join(" ") : "none"}</div>
    </div>`;
  }).join("");
}

function renderAdminAudit() {
  $("#atab-audit").innerHTML = `<div class="card">
    <div class="notice info">Evidentiary log — every warning, approval, override, and queued notice. This is the record for any disputed tow.</div>
    ` + db.audit.map(a => `
    <div class="listitem">
      <div class="row spread">
        <strong style="font-size:14px;">${escapeHtml(a.action.replace(/_/g, " "))}</strong>
        <span class="pill ${a.delivered ? "green" : "amber"}">${a.channel}${a.delivered ? (a.channel === "notice" ? " · posted" : " · sent") : " · queued"}</span>
      </div>
      <div class="meta">${fmtDateTime(a.at)} · → ${escapeHtml(a.recipient)}</div>
      <div style="font-size:13px; margin-top:4px;">${escapeHtml(a.detail)}</div>
    </div>`).join("") + `</div>`;
}

/* =====================================================================
   MODAL + NAV WIRING
   ===================================================================== */
function openModal(html) { $("#modalBody").innerHTML = html; $("#modalBg").classList.add("open"); }
function closeModal() { $("#modalBg").classList.remove("open"); $("#modalBody").innerHTML = ""; }
$("#modalBg").addEventListener("click", e => { if (e.target === $("#modalBg")) closeModal(); });

function roleTag(h) {
  if (h.role === "admin") return h.patrol ? "patrol/admin" : "admin";
  if (h.role === "renter") return "renter";
  return "resident";
}

function buildRoleSelect() {
  const sel = $("#roleSelect");
  // Show all owners/admins, plus only renters whose lease is still active.
  const people = db.homeowners.filter(h => !isRenter(h) || isRenterActive(h));
  sel.innerHTML = people.map(h =>
    `<option value="${h.id}">${escapeHtml(h.name)} (${roleTag(h)})</option>`
  ).join("");
  if (!people.some(h => h.id === state.actingAs)) state.actingAs = people[0].id;
  sel.value = state.actingAs;
  sel.onchange = () => {
    state.actingAs = sel.value;
    // sensible default screen per role
    const u = currentUser();
    state.screen = (u.role === "admin") ? (u.patrol ? "patrol" : "admin") : "resident";
    state.rtab = "permits";
    render();
  };
}

document.querySelectorAll('#bottomNav button').forEach(b =>
  b.addEventListener("click", () => { state.screen = b.dataset.screen; render(); }));
document.querySelectorAll('#residentTabs button').forEach(b =>
  b.addEventListener("click", () => { state.rtab = b.dataset.rtab; render(); }));
document.querySelectorAll('#adminTabs button').forEach(b =>
  b.addEventListener("click", () => { state.atab = b.dataset.atab; render(); }));

$("#lookupForm").addEventListener("submit", e => {
  e.preventDefault();
  renderLookup($("#lookupPlate").value);
  $("#lookupPlate").blur();
});

/* expose handlers used by inline onclick */
window.openLogViolation = openLogViolation;
window.selectRule = selectRule;
window.confirmViolation = confirmViolation;
window.previewViolationPhoto = previewViolationPhoto;
window.clearViolationPhoto = clearViolationPhoto;
window.openViolationDetail = openViolationDetail;
window.decidePermit = decidePermit;
window.modifyPermitPrompt = modifyPermitPrompt;
window.renderAdminViolations = renderAdminViolations;
window.overridePrompt = overridePrompt;
window.doOverride = doOverride;
window.linkPrompt = linkPrompt;
window.doLink = doLink;
window.doRequestPermit = doRequestPermit;
window.addVehicle = addVehicle;
window.confirmDeleteVehicle = confirmDeleteVehicle;
window.doDeleteVehicle = doDeleteVehicle;
window.pickDay = pickDay;
window.calMove = calMove;
window.inviteRenter = inviteRenter;
window.confirmEndLease = confirmEndLease;
window.endLease = endLease;
window.doSubmitPoolParty = doSubmitPoolParty;
window.decidePoolParty = decidePoolParty;
window.decidePartyPrompt = decidePartyPrompt;
window.closeModal = closeModal;
window.state = state;
window.render = render;
window.$ = $;

/* boot */
seedAudit();
purgeExpiredVehicles();
expireRenters();
buildRoleSelect();
render();
</script>
</body>
</html>
